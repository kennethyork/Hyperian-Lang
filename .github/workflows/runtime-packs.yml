name: Native toolchains and runtime packs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-pack:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            executable: build/hyperian
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            executable: build/hyperian
          - platform: macos-x64
            runner: macos-15-intel
            executable: build/hyperian
          - platform: macos-arm64
            runner: macos-15
            executable: build/hyperian
          - platform: windows-x64
            runner: windows-2025
            executable: build/Release/hyperian.exe
    steps:
      - name: Check out Hyperian
        uses: actions/checkout@v6

      - name: Build the native compiler and runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Run the native test suite
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Verify the runner platform
        run: test "$("${{ matrix.executable }}" platform | tr -d '\r')" = "${{ matrix.platform }}"

      - name: Create the downloadable runtime and toolchain archives
        run: |
          version=$("${{ matrix.executable }}" version | awk '{print $2}' | tr -d '\r')
          test "v${version}" = "${GITHUB_REF_NAME}" || test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          mkdir -p dist
          "${{ matrix.executable }}" pack runtime as "dist/hyperian-${version}-${{ matrix.platform }}.hyr"
          package="hyperian-toolchain-${version}-${{ matrix.platform }}"
          cmake --install build --config Release --prefix "stage/${package}"
          test -f "stage/${package}/RUNNING.md"
          if test "${{ matrix.platform }}" = "windows-x64"; then
            tool="stage/${package}/bin/hyperian.exe"
          else
            tool="stage/${package}/bin/hyperian"
          fi
          "${tool}" help run | grep 'You do not need a .hyr file'
          "${tool}" examples/left_aligned_console.hyp | grep 'Hello from left aligned Hyperian'
          cmake -E chdir stage cmake -E tar cf "../dist/${package}.zip" --format=zip "${package}"
          cd dist
          cmake -E sha256sum "hyperian-${version}-${{ matrix.platform }}.hyr" > "hyperian-${version}-${{ matrix.platform }}.hyr.sha256"
          cmake -E sha256sum "${package}.zip" > "${package}.zip.sha256"

      - name: Upload the verified native downloads
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish native downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-runtime-pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every native runtime
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify the release payload
        run: |
          test "$(find dist -maxdepth 1 -name '*.hyr' -type f | wc -l)" -eq 5
          test "$(find dist -maxdepth 1 -name 'hyperian-toolchain-*.zip' -type f | wc -l)" -eq 5
          test "$(find dist -maxdepth 1 -name '*.sha256' -type f | wc -l)" -eq 10
          cd dist
          sha256sum --check *.sha256

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "Hyperian ${GITHUB_REF_NAME#v}"
